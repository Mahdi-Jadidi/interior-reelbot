[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interior-reelbot"
version = "0.1.0"
description = "Telegram-first automated creative director for interior design reels"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
reelbot = "reelbot.app:main"
reelbot-admin = "reelbot.admin:main"

[tool.setuptools.packages.find]
include = ["reelbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
