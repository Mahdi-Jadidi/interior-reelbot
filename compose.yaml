services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - reel_data:/data
    command: ["reelbot"]
  upload:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - reel_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "reelbot.upload:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  reel_data:

